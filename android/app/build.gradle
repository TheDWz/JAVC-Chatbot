apply plugin: 'com.android.application'

// The version comes from rust/Cargo.toml, like the other packages: 1.2.3 -> versionName "1.2.3", versionCode 10203.
def cargoVersion = {
    def line = rootProject.file('../rust/Cargo.toml').readLines().find { it ==~ /^version = "\d+\.\d+\.\d+".*/ }
    if (line == null) throw new GradleException("No version found in rust/Cargo.toml")
    return (line =~ /^version = "(\d+\.\d+\.\d+)"/)[0][1]
}()
def (vMajor, vMinor, vPatch) = cargoVersion.tokenize('.').collect { it as int }

// Release signing: set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
// (the CI workflow does this from repository secrets). Without them the release APK is signed with the debug key.
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace = "io.github.thedwz.javcchatbot"
    compileSdk = 36

    defaultConfig {
        applicationId "io.github.thedwz.javcchatbot"
        minSdk = 26
        targetSdk = 36
        versionCode = vMajor * 10000 + vMinor * 100 + vPatch
        versionName = cargoVersion
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ---- The Rust library: cargo ndk builds libjavc.so for both ABIs into app/src/main/jniLibs ----

// The SDK directory is only known once the plugin has resolved it, so ANDROID_HOME/ANDROID_JAR are set at run time.
def cargoCmd = { List profileArgs ->
    ['cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'x86_64', '-P', '26', '-o', file('src/main/jniLibs').absolutePath, 'build', '--lib'] + profileArgs
}

// Debug and release both write into the same jniLibs folder, so each task starts by deleting it.
tasks.register('cargoDebug', Exec) {
    doFirst {
        delete 'src/main/jniLibs'
        environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
        environment 'ANDROID_JAR', new File(android.sdkDirectory, 'platforms/android-36/android.jar').absolutePath
    }
    workingDir file('../../rust') // the Rust crate
    commandLine cargoCmd(['--profile', 'android-debug'])
    if (System.getenv('ANDROID_NDK_HOME') != null) environment 'ANDROID_NDK_HOME', System.getenv('ANDROID_NDK_HOME')
}

tasks.register('cargoRelease', Exec) {
    doFirst {
        delete 'src/main/jniLibs'
        environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
        environment 'ANDROID_JAR', new File(android.sdkDirectory, 'platforms/android-36/android.jar').absolutePath
    }
    workingDir file('../../rust') // the Rust crate
    commandLine cargoCmd(['--release'])
    if (System.getenv('ANDROID_NDK_HOME') != null) environment 'ANDROID_NDK_HOME', System.getenv('ANDROID_NDK_HOME')
}

// Run the Rust build before packaging, so the APK always contains a freshly built libjavc.so.
// The Android plugin creates these tasks after the script is evaluated, so hook them lazily.
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn 'cargoDebug' }
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'cargoRelease' }
