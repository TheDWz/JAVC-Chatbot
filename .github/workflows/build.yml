name: Build packages

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['rust/**', 'android/**', 'build/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['rust/**', 'android/**', 'build/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libxdo-dev libfontconfig1-dev libxkbcommon-x11-0 libegl1 libgl1-mesa-dri rpm xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Smoke test (self-test against the mock API)
        run: |
          cargo build --manifest-path rust/Cargo.toml
          node rust/selftest/serve.mjs &
          MOCK_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18765/v1/models && break
            [ "$i" = 20 ] && { echo "mock API did not come up"; kill $MOCK_PID; exit 1; }
            sleep 0.5
          done
          TMP=$(mktemp -d)
          mkdir -p "$TMP/javc-chatbot"
          cp rust/selftest/settings.json "$TMP/javc-chatbot/settings.json"
          printf 'hello smoke test\n' > "$TMP/notes.txt"
          XDG_CONFIG_HOME="$TMP" JAVC_SELFTEST=1 JAVC_SELFTEST_FILES="build/icon.png:$TMP/notes.txt" \
            timeout 120 xvfb-run -a rust/target/debug/javc-chatbot
          EXIT=$?
          kill $MOCK_PID
          exit $EXIT
      - name: Build release binary
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Install packaging tools
        run: cargo install --locked cargo-packager@0.11.8 cargo-generate-rpm@0.21.1
      - name: Build AppImage and deb (cargo-packager)
        working-directory: rust
        run: cargo packager --release --formats appimage,deb
      - name: Build rpm (cargo-generate-rpm)
        working-directory: rust
        run: |
          mkdir -p ../dist
          cargo generate-rpm -o ../dist
      - name: Build the tar.gz archive
        run: |
          mkdir -p dist/rust
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path rust/Cargo.toml \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          STAGING="javc-chatbot-$VERSION-linux-x64"
          mkdir -p "dist/rust/$STAGING"
          cp rust/target/release/javc-chatbot "dist/rust/$STAGING/"
          cp build/icon.png "dist/rust/$STAGING/"
          cp LICENSE "dist/rust/$STAGING/"
          tar -czf "dist/javc-chatbot-$VERSION-linux-x64.tar.gz" -C dist/rust "$STAGING"
      - uses: actions/upload-artifact@v4
        with:
          name: javc-chatbot-Linux
          path: |
            dist/rust/*.AppImage
            dist/rust/*.deb
            dist/*.rpm
            dist/javc-chatbot-*-linux-x64.tar.gz
          if-no-files-found: error

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build release binary
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager@0.11.8
      - name: Build NSIS installer (cargo-packager)
        working-directory: rust
        run: cargo packager --release --formats nsis
      - uses: actions/upload-artifact@v4
        with:
          name: javc-chatbot-Windows
          path: dist/rust/*.exe
          if-no-files-found: error

  rust-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android
      - name: Install the NDK, the platform and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install --locked cargo-ndk@4.1.2
      - name: Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=APK signed with a temporary key::The ANDROID_KEYSTORE_BASE64 secret isn't set, so this APK is signed with a throwaway debug key. It installs, but it can't be installed over the released app. See 'Release signing' in the README."
          fi
      - name: Build the release and debug APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APKs
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path rust/Cargo.toml \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/JAVC-Chatbot-$VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/JAVC-Chatbot-$VERSION-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: javc-chatbot-Android
          path: |
            dist/*.apk
            !dist/*-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: javc-chatbot-Android-debug
          path: dist/*-debug.apk
          retention-days: 7
          if-no-files-found: error

  # Installs the debug APK on an emulator and runs the app's self-test against the mock API (settings, the
  # Keystore-encrypted key, models, a streamed reply, stopping, the saved chat), then checks the back button.
  rust-android-smoke:
    needs: rust-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: javc-chatbot-Android-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36 # Android 16: predictive back is the default there, which the back-button check covers
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash rust/selftest/android.sh apk/*.apk
