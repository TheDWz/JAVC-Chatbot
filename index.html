<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; frame-src chatbot-sandbox:">
<title>JAVC Chatbot</title>
<style>
  :root {
    --bg: #0f1014; --surface: #17181e; --surface-2: #1f2129; --line: #2a2c36; --line-soft: #22242c;
    --text: #ecedf2; --muted: #8d91a0; --faint: #5d6170;
    --a1: #8b5cf6; --a2: #3b82f6; --grad: linear-gradient(135deg, var(--a1), var(--a2));
    --err: #f87171; --err-bg: rgba(248,113,113,.08); --err-line: rgba(248,113,113,.3);
    --code-bg: #0b0c10; --shadow: 0 10px 30px rgba(0,0,0,.35); --ring: rgba(139,92,246,.55);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f6f9; --surface: #ffffff; --surface-2: #f0f0f5; --line: #e2e3ea; --line-soft: #ececf2;
      --text: #1a1b22; --muted: #666a78; --faint: #9a9daa;
      --err: #dc2626; --err-bg: rgba(220,38,38,.06); --err-line: rgba(220,38,38,.25);
      --code-bg: #f3f3f7; --shadow: 0 10px 30px rgba(20,20,40,.08); --ring: rgba(139,92,246,.45);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--faint); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .app { display: flex; height: 100%; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* Chat history sidebar */
  #history { width: 264px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line-soft); }
  .app.nohist #history { display: none; }
  .hist-head { padding: 12px; }
  .persona-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .persona-row .pill { flex: 1; min-width: 0; }
  .persona-row .pill select { width: 100%; max-width: none; }
  .newbtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #chatlist { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  #chatlist.locked { opacity: .55; pointer-events: none; }
  .grp { padding: 14px 10px 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .chat-item { display: flex; align-items: center; border-radius: 10px; border: 1px solid transparent; }
  .chat-item:hover { background: var(--surface-2); }
  .chat-item.active { background: color-mix(in srgb, var(--a1) 12%, transparent); border-color: color-mix(in srgb, var(--a1) 45%, transparent); }
  .chat-title { flex: 1; min-width: 0; text-align: left; padding: 8px 10px; background: none; border: 0; cursor: pointer; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .del { width: 28px; height: 28px; margin-right: 4px; opacity: 0; }
  .del svg { width: 15px; height: 15px; }
  .chat-item:hover .del, .del:focus-visible, .del.armed { opacity: 1; }
  .del.armed { width: auto; padding: 0 8px; font-size: 12px; color: var(--err); border-color: var(--err-line); }
  @media (max-width: 720px) {
    #history { position: fixed; inset: 0 auto 0 0; z-index: 25; box-shadow: var(--shadow); }
  }

  /* Error pop-up */
  #errtoast { position: fixed; left: 50%; top: 64px; z-index: 60; transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
    display: flex; gap: 10px; align-items: flex-start; max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--err-line); color: var(--err); font-size: 14px; overflow-wrap: anywhere;
    box-shadow: var(--shadow), inset 0 0 0 100px var(--err-bg); transition: opacity .2s, transform .2s; }
  #errtoast.show { opacity: 1; transform: translate(-50%, 0); }
  #errtoast svg { margin-top: 2px; }

  [hidden] { display: none !important; }
  #profile { max-width: 160px; }
  #templates { justify-content: flex-start; }
  .btn.danger { color: var(--err); border-color: var(--err-line); background: transparent; }
  .perr { margin: 0; color: var(--err); font-size: 13px; overflow-wrap: anywhere; }

  /* Top bar */
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(12px); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; margin-right: auto; }
  .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--grad); box-shadow: 0 4px 14px rgba(139,92,246,.35);
    display: grid; place-items: center; color: #fff; }
  .mark svg { width: 22px; height: 22px; stroke-width: 1.8; }
  .pill { position: relative; display: flex; align-items: center; }
  .pill select { appearance: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 34px 6px 14px; max-width: 300px; font-size: 13.5px; cursor: pointer; transition: border-color .15s; }
  .pill select:hover { border-color: var(--faint); }
  .modelbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 34px 6px 14px; max-width: 300px; font-size: 13.5px;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; transition: border-color .15s; }
  .modelbtn:hover, .modelbtn[aria-expanded="true"] { border-color: var(--faint); }
  #modelpop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(380px, calc(100vw - 32px)); display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; animation: rise .15s ease-out; }
  #modelq { margin: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); outline: 0; font-size: 14px; }
  #modelq:focus { border-color: var(--a1); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  #modellist { max-height: 320px; overflow-y: auto; padding: 0 6px 6px; }
  .mopt { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border: 0; border-radius: 8px;
    background: transparent; cursor: pointer; font-size: 13.5px; overflow-wrap: anywhere; }
  .mopt.hi { background: var(--surface-2); }
  .mopt.cur { color: var(--a1); font-weight: 600; }
  .mopt svg { width: 14px; height: 14px; }
  .mnote { padding: 12px 14px; font-size: 13px; color: var(--muted); }
  .mcount { padding: 7px 14px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line-soft); }
  .pill svg { position: absolute; right: 12px; width: 14px; height: 14px; pointer-events: none; color: var(--muted); }
  .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid transparent;
    background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line-soft); }
  .icon-btn:disabled { opacity: .45; cursor: default; }
  .spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Conversation */
  #scroll { flex: 1; overflow-y: auto; }
  #log { max-width: 780px; margin: 0 auto; padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
  .row { display: flex; gap: 12px; animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .row.user { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); color: #fff; display: grid; place-items: center; flex-shrink: 0; margin-top: 2px;
    border: 0; padding: 0; transition: filter .15s, box-shadow .15s; }
  button.avatar { cursor: pointer; }
  button.avatar:hover { filter: brightness(1.12); }
  .row.open .avatar { box-shadow: 0 0 0 2px var(--ring); }
  .row.thinking .avatar { animation: ring 1.4s ease-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(139,92,246,.55); } 100% { box-shadow: 0 0 0 9px rgba(139,92,246,0); } }
  .think { display: none; min-width: 260px; max-width: 560px; margin-bottom: 8px; border: 1px solid var(--line-soft); border-radius: 14px; background: var(--surface-2); overflow: hidden; }
  .row.open .think { display: block; }
  .think-head { padding: 8px 12px 0; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .row.thinking .think-head::after { content: ' · live'; color: var(--a1); }
  .think-body { padding: 4px 12px 10px; max-height: 300px; overflow-y: auto; font-size: 13px; line-height: 1.55; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .think-body.placeholder { font-style: italic; color: var(--faint); }
  .avatar svg { width: 24px; height: 24px; stroke-width: 1.8; }
  .bubble { max-width: 82%; padding: 10px 15px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .bubble { background: var(--grad); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 6px 18px rgba(80,90,246,.22); }
  .assistant .body { min-width: 0; max-width: calc(100% - 42px); }
  .assistant .bubble { max-width: 100%; background: var(--surface); border: 1px solid var(--line-soft); border-top-left-radius: 6px; }
  .bubble code.inline { font: 13px/1.5 "JetBrains Mono", "Fira Code", ui-monospace, monospace; background: var(--surface-2);
    border: 1px solid var(--line-soft); padding: 1px 6px; border-radius: 6px; }
  .user .bubble code.inline { background: rgba(255,255,255,.18); border-color: transparent; }
  .actions { display: flex; gap: 4px; margin-top: 4px; opacity: 0; transition: opacity .15s; }
  .row:hover .actions, .actions:focus-within { opacity: 1; }
  .mini { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); background: transparent;
    border: 1px solid transparent; border-radius: 7px; padding: 3px 8px; cursor: pointer; }
  .mini:hover { color: var(--text); background: var(--surface-2); border-color: var(--line-soft); }
  .mini svg { width: 13px; height: 13px; }

  .code { margin: 10px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code-bg); white-space: normal; }
  .code-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 12px; font-size: 12px;
    color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 13px/1.55 "JetBrains Mono", "Fira Code", ui-monospace, monospace; white-space: pre; }

  .dots { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }


  .empty { margin: auto; text-align: center; padding: 40px 0; animation: rise .3s ease-out; }
  .empty .big { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px; background: var(--grad); display: grid; place-items: center;
    color: #fff; box-shadow: 0 14px 40px rgba(139,92,246,.35); }
  .empty .big svg { width: 52px; height: 52px; stroke-width: 1.8; }
  .empty h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; font-weight: 650; }
  .empty p { margin: 0 0 22px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13.5px;
    color: var(--muted); cursor: pointer; transition: all .15s; }
  .chip:hover { color: var(--text); border-color: var(--a1); transform: translateY(-1px); }
  .linkish { background: none; border: 0; padding: 0; color: var(--a1); cursor: pointer; text-decoration: underline; }

  /* Composer */
  footer { padding: 8px 20px 14px; }
  .composer { max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: var(--a1); box-shadow: var(--shadow), 0 0 0 3px rgba(139,92,246,.15); }
  .composer textarea { flex: 1; border: 0; outline: 0; background: transparent; resize: none; height: 38px; max-height: 200px; overflow-y: auto; padding: 6px 0; line-height: 1.5; }
  .composer textarea::placeholder { color: var(--faint); }
  .send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--grad); color: #fff; display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0; transition: transform .15s, opacity .15s, filter .15s; }
  .send:hover:not(:disabled) { transform: scale(1.06); filter: brightness(1.1); }
  .send:disabled { opacity: .4; cursor: default; }
  .attach-btn { margin-left: -8px; align-self: flex-end; }
  .attachments { max-width: 780px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 8px; }
  .attachments:empty { display: none; }
  .att { display: inline-flex; align-items: center; gap: 8px; max-width: 240px; padding: 5px 6px 5px 8px; font-size: 12.5px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; animation: rise .2s ease-out; }
  .att img { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; }
  .att .ico { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
  .att .ico svg { width: 15px; height: 15px; }
  .att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .sz { color: var(--faint); }
  .att .icon-btn { width: 22px; height: 22px; border-radius: 7px; }
  .att .icon-btn svg { width: 13px; height: 13px; }
  .ubody { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 82%; }
  .ubody .bubble { max-width: 100%; }
  .ubody .att { padding-right: 10px; }
  .ubody .att.thumb { padding: 0; border: 0; background: none; }
  .ubody .att.thumb img { width: 160px; height: 120px; border-radius: 14px; }
  /* Reasoning side panel */
  #scrim { position: fixed; inset: 0; z-index: 30; background: rgba(5,6,10,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #scrim.on { opacity: 1; pointer-events: auto; }
  #side { position: fixed; top: 0; right: 0; bottom: 0; z-index: 31; width: min(340px, 100vw); background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: var(--shadow); transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; }
  #side.open { transform: none; }
  .side-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 16px 8px 20px; }
  .side-head h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .side-head .sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  #levels { padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .level { text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 12px; cursor: pointer;
    background: transparent; border: 1px solid transparent; transition: background .15s, border-color .15s; }
  .level:hover { background: var(--surface-2); }
  .level[aria-checked="true"] { background: color-mix(in srgb, var(--a1) 12%, transparent); border-color: var(--a1); }
  .level .nm { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .level .tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
  .level .ds { font-size: 12.5px; color: var(--muted); }
  #sidenote { margin: auto 20px 20px; padding-top: 12px; font-size: 12.5px; color: var(--faint); line-height: 1.5; }
  #drop { position: fixed; inset: 12px; z-index: 20; display: none; place-items: center; border: 2px dashed var(--a1); border-radius: 22px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(4px); font-size: 18px; font-weight: 600; pointer-events: none; }
  #drop.on { display: grid; }
  .hint { max-width: 780px; margin: 7px auto 0; text-align: center; font-size: 12px; color: var(--faint); }

  /* Settings dialog */
  dialog { width: min(460px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface);
    color: var(--text); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  dialog[open] { animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } }
  dialog::backdrop { background: rgba(5,6,10,.55); backdrop-filter: blur(4px); }
  dialog form { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  dialog h2 { margin: 0; font-size: 18px; font-weight: 650; }
  dialog .sub { margin: -10px 0 0; color: var(--muted); font-size: 13.5px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .input { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; transition: border-color .15s, box-shadow .15s; }
  .input:focus-within { border-color: var(--a1); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  .input select { flex: 1; border: 0; outline: 0; background: transparent; padding: 10px 12px; font-size: 14px; color: var(--text); }
  .input option { background: var(--surface); }
  .input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 10px 12px; font-size: 14px; color: var(--text); }
  .input textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 10px 12px; font-size: 14px; color: var(--text); resize: vertical; min-height: 120px; }
  .input .icon-btn { width: 30px; height: 30px; margin-right: 4px; }
  .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn { border-radius: 10px; padding: 8px 16px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 550; font-size: 14px; }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--grad); border-color: transparent; color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }

  #toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text); padding: 8px 16px; border-radius: 999px;
    font-size: 13.5px; box-shadow: var(--shadow); transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* Rendered replies (Markdown) */
  .bubble.md { white-space: normal; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .75em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1em 0 .4em; line-height: 1.3; font-weight: 650; }
  .md h1 { font-size: 1.5em; } .md h2 { font-size: 1.3em; } .md h3 { font-size: 1.15em; } .md h4, .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { margin: 0 0 .75em; padding-left: 1.5em; } .md li { margin: .2em 0; } .md li > p { margin: 0 0 .3em; }
  .md blockquote { margin: 0 0 .75em; padding: 2px 0 2px 12px; border-left: 3px solid var(--a1); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .md a { color: var(--a1); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .md .tablewrap { overflow-x: auto; margin: 0 0 .75em; }
  .md table { border-collapse: collapse; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; } .md th { background: var(--surface-2); font-weight: 600; }
  .md input[type=checkbox] { margin-right: 6px; }
  .md kbd { font: 12px ui-monospace, monospace; background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }
  .md mark { background: color-mix(in srgb, var(--a1) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
  .code-actions { display: flex; gap: 4px; }
  /* HTML/CSS/JS from the model: sandboxed frame inside the reply, expandable to the full window */
  .rich { position: relative; margin: 10px 0; border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; white-space: normal; }
  .rich iframe { display: block; width: 100%; height: 60px; border: 0; }
  .rich-exp { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; opacity: 0; background: var(--surface); border: 1px solid var(--line); }
  .rich:hover .rich-exp, .rich-exp:focus-visible { opacity: 1; }
  .rich-exp svg { width: 15px; height: 15px; }
  .richview { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: var(--bg); }
  .richview-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .richview iframe { flex: 1; width: 100%; border: 0; }
  .opt { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); font-size: 13.5px; cursor: pointer; }
  .opt input { margin-top: 3px; accent-color: var(--a1); }
  .opt small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
</style>
</head>
<body>
<div class="app">
<aside id="history" aria-label="Chat history">
  <div class="hist-head"><button class="btn newbtn" id="histnew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div class="persona-row">
      <label class="pill" title="Persona">
        <select id="persona" aria-label="Persona"></select>
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </label>
      <button class="icon-btn" id="newpersona" title="New persona" aria-label="New persona"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="editpersona" title="Edit persona" aria-label="Edit persona"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
  </div>
  <nav id="chatlist"></nav>
</aside>
<div class="main">
<header>
  <button class="icon-btn" id="histbtn" title="Chat history" aria-label="Toggle chat history"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M9 5v14"/></svg></button>
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M15.08 12.87C13.77 15.67 10.44 16.88 7.63 15.58C4.83 14.27 3.62 10.94 4.92 8.13C6.23 5.33 9.56 4.12 12.37 5.42"/><path d="M8.92 11.13C10.23 8.33 13.56 7.12 16.37 8.42C19.17 9.73 20.38 13.06 19.08 15.87C17.77 18.67 14.44 19.88 11.63 18.58"/></svg></span>JAVC Chatbot</div>
  <label class="pill" title="Profile">
    <select id="profile" aria-label="Profile"></select>
    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </label>
  <button class="icon-btn" id="newprofile" title="New profile" aria-label="New profile"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M16 11h6"/></svg></button>
  <div class="pill" id="modelpill" title="Model">
    <button type="button" class="modelbtn" id="modelbtn" aria-haspopup="listbox" aria-expanded="false"><span id="modellabel">No model selected</span></button>
    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    <select id="model" hidden aria-hidden="true" tabindex="-1"><option value="">No model selected</option></select>
    <div id="modelpop" hidden>
      <input id="modelq" type="search" role="combobox" aria-expanded="false" aria-controls="modellist" aria-autocomplete="list" placeholder="Search models…" aria-label="Search models" autocomplete="off" spellcheck="false">
      <div id="modellist" role="listbox" aria-label="Models"></div>
      <div class="mcount" id="modelcount"></div>
    </div>
  </div>
  <button class="icon-btn" id="fetch" title="Fetch models" aria-label="Fetch models"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
  <button class="icon-btn" id="newchat" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="icon-btn" id="reasoning" title="Reasoning level" aria-label="Reasoning level"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
  <button class="icon-btn" id="gear" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<div id="scroll"><main id="log"></main></div>

<footer>
  <div class="attachments" id="attachments"></div>
  <div class="composer">
    <button class="icon-btn attach-btn" id="attach" title="Attach files" aria-label="Attach files"><svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
    <input type="file" id="picker" multiple hidden>
    <textarea id="input" rows="1" placeholder="Message JAVC Chatbot…" aria-label="Message"></textarea>
    <button class="send" id="send" title="Send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for newline</div>
</footer>
</div>
</div>

<dialog id="settings">
  <form id="pform" method="dialog">
    <h2 id="ptitle">Profile settings</h2>
    <p class="sub">Any OpenAI-compatible API works: OpenAI, OpenRouter, NanoGPT, Venice, Ollama, LM Studio…</p>
    <div id="templates" class="chips" hidden></div>
    <label class="field">Profile name
      <span class="input"><input id="pname" placeholder="My provider" spellcheck="false"></span>
    </label>
    <label class="field">Endpoint
      <span class="input"><input id="endpoint" placeholder="https://api.openai.com/v1" spellcheck="false"></span>
    </label>
    <label class="field">API key
      <span class="input"><input id="key" type="password" placeholder="sk-…  (leave empty for local servers)" spellcheck="false">
        <button type="button" class="icon-btn" id="reveal" title="Show key" aria-label="Show key"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </span>
    </label>
    <label class="field">Reasoning request format
      <span class="input"><select id="format">
        <option value="auto">Auto (recommended)</option>
        <option value="openrouter">OpenRouter style: reasoning {effort}</option>
        <option value="openai">OpenAI style: reasoning_effort</option>
        <option value="thinking">DeepSeek / GLM / Kimi style: thinking switch</option>
      </select></span>
      <span style="font-weight:400;color:var(--faint)">Auto uses OpenRouter style when your gateway's model list includes reasoning info.</span>
    </label>
    <p id="perr" class="perr" role="alert" hidden></p>
    <div class="btns">
      <button type="button" class="btn danger" id="pdelete">Delete profile</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" id="pcancel">Cancel</button>
      <button type="submit" class="btn primary" id="save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="personadlg">
  <form id="psform" method="dialog">
    <h2 id="pstitle">New persona</h2>
    <label class="field">Persona name
      <span class="input"><input id="psname" placeholder="Pirate captain" spellcheck="false"></span>
    </label>
    <label class="field">What should the bot call you?
      <span class="input"><input id="psuser" placeholder="Your name" spellcheck="false"></span>
    </label>
    <label class="field">Bot's name
      <span class="input"><input id="psbot" placeholder="Captain" spellcheck="false"></span>
    </label>
    <label class="field">Prompt
      <span class="input"><textarea id="psprompt" placeholder="How the bot should behave…"></textarea></span>
      <span style="font-weight:400;color:var(--faint)">Write {{user}} and {{char}} to insert the two names.</span>
    </label>
    <p id="pserr" class="perr" role="alert" hidden></p>
    <div class="btns">
      <button type="button" class="btn danger" id="psdelete">Delete persona</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" id="pscancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dupdlg">
  <form id="dupform" method="dialog">
    <h2>Duplicate chat</h2>
    <p class="sub" id="dupsub"></p>
    <label class="field">Persona
      <span class="input"><select id="dupsel"></select></span>
    </label>
    <p id="duperr" class="perr" role="alert" hidden></p>
    <div class="btns">
      <button type="button" class="btn" id="dupcancel">Cancel</button>
      <button type="submit" class="btn primary">Duplicate</button>
    </div>
  </form>
</dialog>

<div id="scrim"></div>
<aside id="side" inert aria-label="Chat options">
  <div class="side-head">
    <div><h2>Options</h2><p class="sub" id="sidemodel"></p></div>
    <button class="icon-btn" id="sideclose" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div id="levels" role="radiogroup" aria-label="Reasoning level"></div>
  <p id="sidenote"></p>
  <label class="opt"><input type="checkbox" id="richopt"><span>Rich replies<small>Tells the model it can reply with HTML, CSS and JavaScript. They run in a sandbox with internet access, and Markdown always works.</small></span></label>
</aside>
<div id="drop">Drop files to attach</div>
<div id="errtoast" role="alert"></div>
<div id="toast" role="status"></div>

<script src="node_modules/marked/lib/marked.umd.js"></script>
<script src="lib.js"></script>
<script src="renderer.js"></script>
</body>
</html>
